[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "0"

[[redirects]]
  from = "/api/opportunities"
  to = "/.netlify/functions/get-opportunities"
  status = 200

[[redirects]]
  from = "/api/scan-status"
  to = "/.netlify/functions/get-scan-status"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
